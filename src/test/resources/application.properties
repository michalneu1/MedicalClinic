spring.datasource.url=jdbc:h2:mem:clinic;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.data.web.pageable.max-page-size=100
spring.liquibase.change-log=classpath:liquibase-changelog/liquibase-changelog.yaml
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
