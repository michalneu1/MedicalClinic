spring.datasource.url=jdbc:postgresql://localhost:5432/clinic
spring.datasource.username=clinic
spring.datasource.password=clinic
spring.sql.init.mode=always
spring.liquibase.change-log=classpath:liquibase-changelog/liquibase-changelog.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.file.name=logs/medical-clinic.log
logging.level.com.medicalclinic=DEBUG
logging.pattern.correlation=[%X{requestId}] 
spring.data.web.pageable.max-page-size=100
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
